name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release/**"

jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run fast checks
        run: |
          pytest tests/test_pipeline.py tests/test_docs_consistency.py tests/test_packaging.py -q
          pytest tests/test_cli.py -k "help_contract or roundtrip_help_describes_diff_report_flag" -q

  full-suite:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run full suite
        run: |
          pytest -q
