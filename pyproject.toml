[project]
name = "sql-obfuscator"
version = "0.0.1"
description = "Reversible obfuscation of SQL scripts so they can be shared with an LLM."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The engine depends on tokenizer details of this release line; see docs/adr/0001.
    "sqlglot>=30.22,<31",
    "typer>=0.15",
]

[project.scripts]
sqlobf = "sql_obfuscator.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sql_obfuscator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
