[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-obfuscator"
version = "0.1.0"
description = "AST-based SQL identifier obfuscator for T-SQL scripts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "sqlglot>=26.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
